name: Scheduled worker
on:
  schedule:
    # Bounded polling blocks avoid a fresh queued start for every individual poll.
    - cron: '3,33 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/worker.yml', 'public_worker.py', 'tests/test_worker.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-worker
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify generic worker cadence
        run: python3 -m unittest discover -s tests
      - name: Run private application without publishing its output
        env:
          PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_REPOSITORY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_CYCLES: ${{ github.event_name == 'push' && '1' || '4' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SUMMARY_MODEL: ${{ vars.OPENAI_SUMMARY_MODEL }}
          ALLOW_PAID_SUMMARIES: ${{ vars.ALLOW_PAID_SUMMARIES }}
          MAX_DAILY_SUMMARIES: ${{ vars.MAX_DAILY_SUMMARIES || '10' }}
        run: python3 public_worker.py
